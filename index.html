<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De Dagelijkse Knop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .day-counter {
            font-size: 1.2rem;
            color: #a0a0a0;
            margin-bottom: 2rem;
        }

        .button-container {
            position: relative;
            margin: 2rem 0;
        }

        #theButton {
            font-size: 2rem;
            padding: 1.5rem 3rem;
            border: none;
            border-radius: 50px;
            background: linear-gradient(145deg, #e94560, #ff6b6b);
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
        }

        #theButton:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(233, 69, 96, 0.6);
        }

        #theButton:active {
            transform: translateY(0) scale(0.98);
        }

        #result {
            margin-top: 2rem;
            padding: 2rem;
            min-height: 150px;
            font-size: 1.5rem;
            max-width: 600px;
            line-height: 1.6;
        }

        .hint {
            position: fixed;
            bottom: 2rem;
            color: #555;
            font-size: 0.9rem;
        }

        /* Animaties voor effecten */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }

        @keyframes rainbow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .shake { animation: shake 0.5s ease-in-out; }
        .spin { animation: spin 1s ease-in-out; }
        .bounce { animation: bounce 0.5s ease-in-out 3; }
        .rainbow { animation: rainbow 2s linear infinite; }

        /* Confetti container */
        #confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: fall 3s linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>

        // Bereken de dag van het jaar (1-365)
        function getDayOfYear() {
            const now = new Date();
            const start = new Date(now.getFullYear(), 0, 0);
            const diff = now - start;
            const oneDay = 1000 * 60 * 60 * 24;
            return Math.floor(diff / oneDay);
        }

        // Toon welke dag het is
        const dayNumber = getDayOfYear();
        document.getElementById('dayNumber').textContent = dayNumber;

        // Helper functies
        function showText(text) {
            document.getElementById('result').innerHTML = text;
        }

        function typeWriter(text) {
            const result = document.getElementById('result');
            result.innerHTML = '';
            let i = 0;
            const timer = setInterval(() => {
                if (i < text.length) {
                    if (text[i] === '.') {
                        result.innerHTML += '';
                    } else {
                        result.innerHTML += text[i];
                    }
                    i++;
                } else {
                    clearInterval(timer);
                }
            }, 100);
        }

        function resetBackground() {
            document.body.style.background = "linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)";
        }

        function shakeScreen() {
            document.body.classList.add('shake');
            setTimeout(() => document.body.classList.remove('shake'), 500);
        }

        function spinButton() {
            const btn = document.getElementById('theButton');
            btn.classList.add('spin');
            setTimeout(() => btn.classList.remove('spin'), 1000);
        }

        function bounceButton() {
            const btn = document.getElementById('theButton');
            btn.classList.add('bounce');
            setTimeout(() => btn.classList.remove('bounce'), 1500);
        }

        function rainbowMode() {
            document.body.classList.add('rainbow');
            setTimeout(() => document.body.classList.remove('rainbow'), 5000);
        }

        function confetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#1dd1a1', '#5f27cd'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                container.appendChild(confetti);
                setTimeout(() => confetti.remove(), 3000);
            }
        }

        function disco() {
            let count = 0;
            const interval = setInterval(() => {
                document.body.style.background = `hsl(${Math.random() * 360}, 70%, 30%)`;
                count++;
                if (count > 10) {
                    clearInterval(interval);
                    resetBackground();
                }
            }, 200);
        }

        function matrixRain() {
            document.body.style.background = '#000';
            document.body.style.color = '#0f0';
            setTimeout(() => {
                resetBackground();
                document.body.style.color = 'white';
            }, 3000);
        }

        function invertColors() {
            document.body.style.filter = 'invert(1)';
            setTimeout(() => document.body.style.filter = 'none', 2000);
        }

        function pixelate() {
            document.body.style.imageRendering = 'pixelated';
            document.body.style.fontSize = '30px';
            setTimeout(() => {
                document.body.style.imageRendering = 'auto';
                document.body.style.fontSize = '';
            }, 2000);
        }

        function fireworks() {
            confetti();
            setTimeout(confetti, 500);
            setTimeout(confetti, 1000);
        }

        function playSound(freq) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.frequency.value = freq;
                osc.connect(ctx.destination);
                osc.start();
                setTimeout(() => osc.stop(), 200);
            } catch(e) {}
        }

            const btn = document.getElementById('theButton');
            btn.style.transform = 'scale(1.5)';
            setTimeout(() => btn.style.transform = '', 1000);

            for (let i = 0; i < 30; i++) {

            result.style.transform = 'translateY(100px)';
            setTimeout(() => result.style.transform = '', 1000);

            for (let i = 0; i < 30; i++) {
                const star = document.createElement('div');
                star.innerHTML = '⭐';

                star.style.fontSize = Math.random() * 15 + 10 + 'px';
                star.style.opacity = '0';
                star.style.transition = 'opacity 0.5s';
                document.body.appendChild(star);
                setTimeout(() => star.style.opacity = '1', 100);
                setTimeout(() => { star.style.opacity = '0'; setTimeout(() => star.remove(), 500); }, 2000);
            }
        }

        function reverseGravity() {
            document.body.style.transform = 'rotate(180deg)';
            setTimeout(() => document.body.style.transform = '', 2000);
        }

        function glitchEffect() {
            const result = document.getElementById('result');
            let count = 0;
            const interval = setInterval(() => {
                result.style.transform = `translate(${Math.random()*10-5}px, ${Math.random()*10-5}px)`;
                result.style.textShadow = `${Math.random()*5}px 0 red, ${-Math.random()*5}px 0 cyan`;
                count++;
                if (count > 20) {
                    clearInterval(interval);
                    result.style.transform = '';
                    result.style.textShadow = '';
                }
            }, 50);
        }

        // Main button click handler
        document.getElementById('theButton').addEventListener('click', function() {
            const todayAction = actions[(dayNumber - 1) % 365];
            if (todayAction) {
                todayAction();
            }
        });

        // Show initial hint
        document.getElementById('result').innerHTML = "👆 Druk op de knop om te zien wat vandaag doet!";
